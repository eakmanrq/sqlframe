  };
  const urls = { docs: 'https://sqlframe.readthedocs.io/en/stable/', github: 'https://github.com/eakmanrq/sqlframe' };
  const engines = ['DuckDB', 'BigQuery', 'Snowflake', 'Postgres', 'Databricks', 'Spark'];
  const mark = '<span class="sf-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M10 4H4v24h6M22 4h6v24h-6" stroke="currentColor" stroke-width="2.5"/><path d="M11 11h10M11 16h10M11 21h6" stroke="currentColor" stroke-width="2"/></svg></span>';
  const wordmark = `${mark}<span>SQLFrame</span>`;
  const source = 'from sqlframe.duckdb import DuckDBSession\n\nsession = DuckDBSession()\n\ndf = (session.table("orders")\n    .groupBy("country")\n    .sum("revenue"))';
  const sql = 'SELECT\n  country,\n  SUM(revenue) AS "sum(revenue)"\nFROM orders\nGROUP BY country';
  const quickstart = 'from sqlframe.duckdb import DuckDBSession\n\nsession = DuckDBSession()\ndf = session.createDataFrame(\n    [("US", 120), ("UK", 80), ("US", 30)],\n    ["country", "revenue"],\n)\ndf.groupBy("country").sum("revenue").show()';
  const connectionCode = {
    simple: 'from sqlframe.duckdb import DuckDBSession\n\n# Start with an in-memory database\nsession = DuckDBSession()',
    existing: 'import duckdb\nfrom sqlframe.duckdb import DuckDBSession\n\nconnection = duckdb.connect("analytics.duckdb")\nsession = DuckDBSession(conn=connection)',
    activate: 'from sqlframe import activate\n\nactivate("duckdb")\n\nfrom pyspark.sql import SparkSession\nsession = SparkSession.builder.getOrCreate()'
  };
  function escape(text) { return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function highlight(code) {
    return code.split(/(#[^\n]*|"[^"\n]*"|'[^'\n]*'|\b(?:from|import|SELECT|SUM|AS|FROM|GROUP|BY)\b)/g).map(token => {
      const cls = token.startsWith('#') ? 'sf-comment' : /^["']/.test(token) ? 'sf-string' : /^(from|import|SELECT|SUM|AS|FROM|GROUP|BY)$/.test(token) ? 'sf-keyword' : '';
      return cls ? `<span class="${cls}">${escape(token)}</span>` : escape(token);
    }).join('');
  }
  function copyButton() { return '<button type="button" class="sf-copy" data-copy>Copy</button>'; }
  function codeBlock(code, label) { return `<div class="sf-code"><div class="sf-code-head"><span>${label}</span>${copyButton()}</div><pre><code>${highlight(code)}</code></pre></div>`; }
  function engineLink(engine) {
    return engine === 'DuckDB' ? '<button type="button" class="sf-nav-button" data-go="guide">DuckDB</button>' : `<a href="${urls.docs}${engine.toLowerCase()}/" target="_blank" rel="noopener noreferrer">${engine}</a>`;
  }
  function header() {
    return `<header class="sf-header"><button type="button" class="sf-wordmark" data-go="home" aria-label="SQLFrame home">${wordmark}</button><nav class="sf-header-nav" aria-label="SQLFrame navigation"><button type="button" class="sf-nav-button" data-go="guide">Get started</button><a href="${urls.docs}configuration/" target="_blank" rel="noopener noreferrer">Guides ↗</a><button type="button" class="sf-nav-button" data-go="engines">Engines</button><a href="${urls.github}" target="_blank" rel="noopener noreferrer">GitHub ↗</a></nav></header>`;
  }
  function footer() { return `<footer class="sf-footer"><span>SQLFrame · The universal DataFrame API</span><span>Open source · MIT license</span></footer>`; }
  function demo() {
    return `<div class="sf-code sf-demo"><div class="sf-code-head"><span>Python → SQL preview</span><span>DuckDB</span></div><pre><code>${highlight(source)}</code></pre><div class="sf-code-separator">↓ GENERATED SQL · ILLUSTRATIVE</div><pre><code>${highlight(sql)}</code></pre></div>`;
  }
  function home() {
    const d = directions[state.direction];
    return `${header()}<main><section class="sf-hero"><div class="sf-hero-intro"><span class="sf-eyebrow">${d.eyebrow}</span><h1>${d.headline}</h1><p class="sf-hero-description">${d.description}</p><div class="sf-actions"><button type="button" class="sf-primary" data-go="guide">Get started →</button><button type="button" class="sf-secondary" data-go="engines">Choose your engine</button></div></div>${demo()}</section><div class="sf-engine-strip" id="sf-engine-list"><strong>Runs on</strong>${engines.map(engineLink).join('')}</div><section class="sf-benefits" aria-label="Why SQLFrame"><div><span class="sf-benefit-index">01 / FAMILIAR</span><h3>Keep your DataFrame API</h3><p>Use familiar PySpark transformations, joins, and window functions.</p></div><div><span class="sf-benefit-index">02 / DIRECT</span><h3>Use your database</h3><p>Execute transformations where your data already lives.</p></div><div><span class="sf-benefit-index">03 / TRANSPARENT</span><h3>See the SQL</h3><p>Inspect and share the SQL behind your DataFrame code.</p></div></section><section class="sf-quickstart"><div class="sf-section-top"><h2>Start small. Run locally.</h2><button type="button" class="sf-nav-button" data-go="guide">DuckDB quickstart →</button></div><div class="sf-install"><code>pip install "sqlframe[duckdb]"</code>${copyButton()}</div><div class="sf-steps">${codeBlock(quickstart, 'Python · no cloud account needed')}<div class="sf-code"><div class="sf-code-head">Result</div>${output()}<p class="sf-small-note" style="padding:0 15px 15px">Three rows of data. One familiar API. Executed by DuckDB.</p></div></div></section><section class="sf-paths" aria-label="More ways to use SQLFrame"><a class="sf-path" href="${urls.docs}configuration/#activating-sqlframe" target="_blank" rel="noopener noreferrer"><h3>Bring an existing PySpark pipeline ↗</h3><span>Keep your imports using SQLFrame activation.</span></a><a class="sf-path" href="${urls.docs}standalone/" target="_blank" rel="noopener noreferrer"><h3>Just need the SQL? ↗</h3><span>Generate queries with a standalone session.</span></a></section></main>${footer()}`;
  }
  function output() { return '<table class="sf-output"><thead><tr><th>country</th><th>sum(revenue)</th></tr></thead><tbody><tr><td>UK</td><td>80</td></tr><tr><td>US</td><td>150</td></tr></tbody></table>'; }
  function sidebar() {
    return `<aside class="sf-sidebar" aria-label="Documentation navigation"><div class="sf-sidebar-label">Get started</div><button type="button" data-go="home">Introduction</button><a href="#sf-guide-install">Installation</a><div class="sf-sidebar-label">Engines</div><a href="#sf-guide-install" class="sf-sidebar-active" aria-current="page">DuckDB</a>${engines.filter(x => x !== 'DuckDB').map(x => `<a href="${urls.docs}${x.toLowerCase()}/" target="_blank" rel="noopener noreferrer">${x} ↗</a>`).join('')}<a href="${urls.docs}standalone/" target="_blank" rel="noopener noreferrer">Standalone ↗</a><div class="sf-sidebar-label">Go deeper</div><a href="${urls.docs}configuration/" target="_blank" rel="noopener noreferrer">Configuration ↗</a><a href="${urls.docs}duckdb/#supported-pyspark-api-methods" target="_blank" rel="noopener noreferrer">API compatibility ↗</a></aside>`;
  }
  function connectionPanel() {
    return `<div class="sf-code"><div class="sf-code-tabs" role="group" aria-label="Connection example"><button type="button" data-connection="simple" aria-pressed="${state.connection === 'simple'}">In memory</button><button type="button" data-connection="existing" aria-pressed="${state.connection === 'existing'}">Existing connection</button><button type="button" data-connection="activate" aria-pressed="${state.connection === 'activate'}">PySpark imports</button></div><div class="sf-code-head"><span>Python</span>${copyButton()}</div><pre><code>${highlight(connectionCode[state.connection])}</code></pre></div>`;
  }
  function guide() {
    return `${header()}<div class="sf-guide-layout">${sidebar()}<main class="sf-guide-body"><div class="sf-breadcrumb">Engines / DuckDB</div><span class="sf-eyebrow">Local development · No credentials needed</span><h1>Get started with DuckDB</h1><p class="sf-guide-lead">Run PySpark-style transformations locally with an in-memory database or your existing DuckDB connection.</p><nav class="sf-guide-toc" aria-label="On this page"><a href="#sf-guide-install">Install</a><a href="#sf-guide-session">Create a session</a><a href="#sf-guide-query">Run a query</a></nav><section class="sf-guide-section" id="sf-guide-install"><h2><span class="sf-number">1</span>Install SQLFrame</h2><div class="sf-install"><code>pip install "sqlframe[duckdb]"</code>${copyButton()}</div></section><section class="sf-guide-section" id="sf-guide-session"><h2><span class="sf-number">2</span>Create a session</h2><p>Start in memory, connect to a database file, or keep your existing PySpark imports.</p><div class="sf-connection-panel">${connectionPanel()}</div><aside class="sf-callout"><span aria-hidden="true">↳</span><p>The default session uses an in-memory database. Pass a connection to keep data in a DuckDB file.</p></aside></section><section class="sf-guide-section" id="sf-guide-query"><h2><span class="sf-number">3</span>Run your first transformation</h2><p>Create a small DataFrame, group by country, and calculate total revenue.</p>${codeBlock('df = session.createDataFrame(\n    [("US", 120), ("UK", 80), ("US", 30)],\n    ["country", "revenue"],\n)\ndf.groupBy("country").sum("revenue").show()', 'Python')}<div style="margin-top:12px">${output()}</div><p class="sf-small-note">Result row order may vary.</p></section><section class="sf-guide-section"><h2>Keep exploring</h2><p><a href="${urls.docs}duckdb/#supported-pyspark-api-methods" target="_blank" rel="noopener noreferrer">Browse supported APIs ↗</a> · <a href="${urls.docs}configuration/#generated-sql" target="_blank" rel="noopener noreferrer">Inspect generated SQL ↗</a></p></section></main></div>${footer()}`;
  }
  function readme() {
    const d = directions[state.direction];
    return `<div class="sf-readme"><div class="sf-github-bar"><span>▤ &nbsp; README.md</span><span>eakmanrq / sqlframe</span></div><main class="sf-readme-content"><div class="sf-readme-banner">${state.direction === 'editorial' ? '<div class="sf-readme-kicker">Python in. Possibilities out.</div>' : ''}<div class="sf-wordmark">${wordmark}</div><h1>${d.readme}</h1><p>Run the PySpark DataFrame API directly on your database.<br>No Spark cluster required.</p><div class="sf-license"><span>license</span><span>MIT</span></div><nav class="sf-readme-links" aria-label="Project links"><button type="button" class="sf-nav-button" data-go="guide">Quickstart →</button><button type="button" class="sf-nav-button" data-go="home">Documentation →</button><a href="${urls.github}/issues" target="_blank" rel="noopener noreferrer">Report an issue ↗</a></nav></div><section class="sf-readme-section"><h2>Why SQLFrame?</h2><ul><li><strong>Familiar API.</strong> Write transformations with the PySpark DataFrame API.</li><li><strong>Direct execution.</strong> Run your transformations on your database engine.</li><li><strong>Visible SQL.</strong> Inspect, debug, and share generated queries.</li></ul></section><section class="sf-readme-section"><h2>Try it locally</h2><p>Install SQLFrame with DuckDB. No cloud account or Spark installation needed.</p><div class="sf-install"><code>pip install "sqlframe[duckdb]"</code>${copyButton()}</div>${codeBlock(quickstart, 'Python')}${codeBlock('+---------+------------+\n| country |sum(revenue)|\n+---------+------------+\n| UK      |          80|\n| US      |         150|\n+---------+------------+', 'Example output · row order may vary')}</section><section class="sf-readme-section"><h2>Choose your engine</h2><table class="sf-readme-engines"><thead><tr><th>Engine</th><th>Install</th></tr></thead><tbody>${engines.map(x => `<tr><td>${engineLink(x)}</td><td><code>sqlframe[${x.toLowerCase()}]</code></td></tr>`).join('')}<tr><td><a href="${urls.docs}standalone/" target="_blank" rel="noopener noreferrer">Standalone</a></td><td><code>sqlframe</code></td></tr></tbody></table><p>Community integrations: <a href="https://github.com/gizmodata/sqlframe-gizmosql" target="_blank" rel="noopener noreferrer">GizmoSQL ↗</a> · <a href="${urls.docs}redshift/" target="_blank" rel="noopener noreferrer">Redshift ↗</a></p></section><section class="sf-readme-section"><h2>Already using PySpark?</h2><p>Activate SQLFrame before importing PySpark to run supported transformations on another engine.</p>${codeBlock('from sqlframe import activate\nactivate("duckdb")\n\nfrom pyspark.sql import SparkSession\nsession = SparkSession.builder.getOrCreate()', 'Python')}<p><a href="${urls.docs}configuration/#activating-sqlframe" target="_blank" rel="noopener noreferrer">Read the activation guide ↗</a> · <a href="${urls.docs}standalone/" target="_blank" rel="noopener noreferrer">Generate SQL without a database ↗</a></p></section></main></div>`;
  }
  function render() {
    root.dataset.direction = state.direction;
    root.querySelector('.sf-direction-label').textContent = directions[state.direction].label;
    root.querySelectorAll('[data-direction-pick]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.directionPick === state.direction)));
    root.querySelectorAll('[data-page-pick]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.pagePick === state.page)));
    product.innerHTML = state.page === 'guide' ? guide() : state.page === 'readme' ? readme() : home();
  }
  root.addEventListener('click', async event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.directionPick) {
      state.direction = button.dataset.directionPick;
      if (state.theme === null) root.style.colorScheme = state.direction === 'terminal' ? 'dark' : 'light dark';
      render();
    } else if (button.dataset.pagePick) {
      state.page = button.dataset.pagePick;
      render();
    } else if (button.classList.contains('sf-theme')) {
      const dark = root.style.colorScheme === 'dark' || (root.style.colorScheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      state.theme = dark ? 'light' : 'dark';
      root.style.colorScheme = state.theme;
      button.setAttribute('aria-label', `Switch preview to ${dark ? 'dark' : 'light'} theme`);
    } else if (button.dataset.go) {
      if (button.dataset.go === 'engines') {
        state.page = 'home';
        render();
        root.querySelector('#sf-engine-list').scrollIntoView({ block: 'nearest' });
      } else {
        state.page = button.dataset.go;
        render();
      }
    } else if (button.dataset.connection) {
      state.connection = button.dataset.connection;
      root.querySelector('.sf-connection-panel').innerHTML = connectionPanel();
    } else if (button.hasAttribute('data-copy')) {
      const container = button.closest('.sf-install, .sf-code');
      const code = container.querySelector('code').textContent;
      try {
        await navigator.clipboard.writeText(code);
        button.textContent = 'Copied';
      } catch {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(container.querySelector('code'));
        selection.removeAllRanges();
        selection.addRange(range);
        button.textContent = 'Selected';
      }
      setTimeout(() => { button.textContent = 'Copy'; }, 1800);
    }
  });
  render();
})();
</script>

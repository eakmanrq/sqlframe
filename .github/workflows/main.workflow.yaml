name: SQLFrame
on:
  push:
    branches:
    - main
    paths:
      - 'sqlframe/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'scripts/test-trino.sh'
  pull_request:
    types:
    - synchronize
    - opened
    paths:
    - '.github/workflows/**'
    - 'sqlframe/**'
    - 'tests/**'
    - 'scripts/**'
    - 'Makefile'
    - 'pyproject.toml'
    - 'scripts/test-trino.sh'
    - 'uv.lock'
jobs:
  run-tests:
    # Keep PostgreSQL 18 available for the Configure Postgres step.
    runs-on: ubuntu-26.04
    env:
      PYTEST_XDIST_AUTO_NUM_WORKERS: 4
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Use Java 21
      run: |
        : "${JAVA_HOME_21_X64:?Java 21 is unavailable}"
        echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
        "$JAVA_HOME_21_X64/bin/java" -version
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --all-extras
    - name: Run Style
      run: uv run make style
    - name: Configure Postgres
      run: |
        echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
        /usr/lib/postgresql/18/bin/postgres --version
    - name: Run tests
      run: uv run make local-test
  minimum-sqlglot:
    runs-on: ubuntu-latest
    env:
      PYTEST_XDIST_AUTO_NUM_WORKERS: 4
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Resolve SQLGlot minimum from project metadata
      id: resolve_sqlglot
      shell: bash
      run: |
        set -euo pipefail
        requirements_file="$(mktemp)"
        uv pip compile pyproject.toml --resolution lowest-direct --no-deps --quiet --output-file "$requirements_file"

        sqlglot_pin_count=0
        sqlglot_pin=""
        while IFS= read -r pin; do
          sqlglot_pin_count=$((sqlglot_pin_count + 1))
          sqlglot_pin="$pin"
        done < <(grep -iE '^sqlglot==[^[:space:]]+$' "$requirements_file" || true)
        if [[ "$sqlglot_pin_count" -ne 1 ]]; then
          echo "Expected exactly one SQLGlot pin, found $sqlglot_pin_count" >&2
          cat "$requirements_file" >&2
          exit 1
        fi

        echo "Resolved SQLGlot minimum from pyproject.toml: $sqlglot_pin"
        echo "sqlglot_pin=$sqlglot_pin" >> "$GITHUB_OUTPUT"
        {
          echo "### SQLGlot minimum compatibility"
          echo
          echo "Resolved from pyproject.toml: $sqlglot_pin."
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Install normal dependencies
      run: uv sync --all-extras --locked
    - name: Layer resolved SQLGlot minimum
      env:
        SQLGLOT_PIN: ${{ steps.resolve_sqlglot.outputs.sqlglot_pin }}
      run: |
        uv pip install --python .venv/bin/python "$SQLGLOT_PIN"
        .venv/bin/python -c 'import sqlglot; print(f"Testing SQLGlot {sqlglot.__version__}")'
    - name: Run unit tests at resolved SQLGlot minimum
      run: uv run --no-sync pytest -n 0 tests/unit
    - name: Run DuckDB lambda tests at resolved SQLGlot minimum
      run: |
        uv run --no-sync pytest -n 0 tests/integration/engines/duck/test_duckdb_dataframe.py -k lambda_functions_with_collection_and_pandas
        uv run --no-sync pytest -n 0 -m local tests/integration/engines/test_int_functions.py -k 'array_join or array_remove or array_except or arrays_zip or array_compact'
  trino-integration:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Run Trino integration tests
      run: make trino-test
  minimum-duckdb:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Install dependencies
      run: uv sync --all-extras --locked
    - name: Install oldest supported DuckDB release
      run: uv pip install --python .venv/bin/python 'duckdb==1.2.0'
    - name: Run DuckDB compatibility tests
      run: uv run --no-sync pytest -n 0 tests/integration/engines/duck/test_duckdb_*.py
  clickhouse-integration:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Run ClickHouse integration tests
      run: make clickhouse-test

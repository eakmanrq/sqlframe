site_name: SQLFrame
site_url: !ENV [READTHEDOCS_CANONICAL_URL, null]
site_description: Run the PySpark DataFrame API directly on your database. No Spark cluster required.
repo_url: https://github.com/eakmanrq/sqlframe
repo_name: eakmanrq/sqlframe
nav:
  - Home: index.md
  - Get started: quickstart.md
  - Guides:
      - Configuration: configuration.md
      - More examples: examples.md
  - Engines:
      - Choose your engine: engines.md
      - DuckDB: duckdb.md
      - BigQuery: bigquery.md
      - Snowflake: snowflake.md
      - Postgres: postgres.md
      - Databricks: databricks.md
      - Spark: spark.md
      - Standalone: standalone.md
      - Redshift (community): redshift.md
  - API reference:
      - Compatibility overview: reference/index.md
      - DuckDB: reference/duckdb.md
      - BigQuery: reference/bigquery.md
      - Snowflake: reference/snowflake.md
      - Postgres: reference/postgres.md
      - Databricks: reference/databricks.md
      - Spark: reference/spark.md
      - Standalone: reference/standalone.md
      - Redshift (community): reference/redshift.md
theme:
  name: material
  custom_dir: docs/overrides
  logo: images/frame.svg
  favicon: images/frame.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.tabs.link
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
plugins:
  - include-markdown
  - search
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
extra_css:
  - stylesheets/extra.css

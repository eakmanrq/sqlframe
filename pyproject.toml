[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlframe"
description = "Turning PySpark Into a Universal DataFrame API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Eakman", email = "eakmanrq@gmail.com" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "prettytable<4",
    "sqlglot>=30.0.0,<30.26",
    "typing_extensions",
    "more-itertools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: SQL",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/eakmanrq/sqlframe"

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery[pandas]>=3,<4",
    "google-cloud-bigquery-storage>=2,<3",
]
clickhouse = [
    "clickhouse-connect>=0.13,<2",
]
databricks = [
    "databricks-sql-connector[pyarrow]>=3.6,<5",
]
dev = [
    # chdb-core publishes no Windows wheels
    "chdb>=4.4,<5; sys_platform != 'win32'",
    "duckdb>=1.2,<2.1",
    "findspark>=2,<3",
    # 3.0.0 dropped support for Python 3.9 and this is needed by pytest-postgresql
    "mirakuru<3.0.5",
    "ty>=0.0.18",
    "openai>=1.30,<4",
    "pandas>=2,<4",
    "pandas-stubs>=2,<4",
    "psycopg>=3.1,<4",
    "pyarrow>=10,<27",
    "pyspark>=4,<4.3",
    "pytest>=8.2.0,<9.2",
    "pytest-forked",
    "pytest-postgresql>=6,<10",
    "pytest-rerunfailures",
    "pytest-xdist>=3.6,<3.9",
    "pre-commit>=3.7,<5",
    "ruff>=0.4.4,<0.18",
    "types-psycopg2>=2.9,<3",
]
docs = [
    "mkdocs==1.4.2",
    "mkdocs-include-markdown-plugin==6.0.6",
    "mkdocs-material==9.0.5",
    "mkdocs-material-extensions==1.1.1",
    "pymdown-extensions",
]
duckdb = [
    "duckdb>=1.2,<2.1",
    "pandas>=2,<4",
]
openai = [
    "openai>=1.30,<4",
]
pandas = [
    "pandas>=2,<4",
]
postgres = [
    "psycopg2>=2.8,<3",
]
redshift = [
    "redshift_connector>=2.1.14,<2.3.0",
]
snowflake = [
    "snowflake-connector-python[secure-local-storage]>=4.7.3,<6",
]
spark = [
    "pyspark>=4,<4.3",
]
standalone = [
    "pyarrow>=10,<27",
]
trino = [
    "trino>=0.330,<1",
]

[tool.setuptools.packages.find]
include = ["sqlframe", "sqlframe.*"]

[tool.setuptools.package-data]
sqlframe = ["py.typed", "*.pyi", "**/*.pyi"]

[tool.setuptools_scm]
version_file = "sqlframe/_version.py"
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
markers = [
    "bigquery: test for BigQuery",
    "clickhouse: test against a ClickHouse server",
    "duckdb: test for DuckDB",
    "local: tests that don't rely on external connections",
    "postgres: test for Postgres",
    "trino: test against a Trino server",
]
addopts = "-n 0 --dist=loadgroup"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I"]
ignore = ["E721", "E741"]
